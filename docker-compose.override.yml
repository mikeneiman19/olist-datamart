services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./app:/app
    command: sh -c "pip install -r requirements.txt && streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    environment:
      DB_HOST: postgres
      DB_USER: bi_user
      DB_PASSWORD: bi_password
      DB_NAME: bi_database
    ports:
      - "8501:8501"
    depends_on:
      - postgres